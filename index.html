<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Birthday Wasay</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #ffe6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
        }
        .video-frame {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        .title {
            font-family: 'Fredoka One', cursive;
            color: #ff4757;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
            text-align: center;
        }
        
        /* Pure CSS Dudububu Animation */
        .dudububu-css {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
            position: relative;
            height: 130px;
            align-items: flex-end;
        }

        @keyframes bobbing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes bobbing-delayed {
            0%, 100% { transform: translateY(-6px); }
            50% { transform: translateY(6px); }
        }

        .panda {
            position: relative;
            width: 100px;
            height: 100px;
            animation: bobbing 2s infinite ease-in-out;
        }
        .bear {
            position: relative;
            width: 100px;
            height: 100px;
            animation: bobbing-delayed 2s infinite ease-in-out;
        }

        .panda .face, .bear .face {
            position: absolute;
            width: 100px;
            height: 90px;
            border-radius: 50% 50% 45% 45%;
            bottom: 0;
            box-shadow: 0 8px 15px rgba(0,0,0,0.06);
        }
        .panda .face { background: #fff; border: 2px solid #fbcfe8; }
        .bear .face { background: #ffedd5; border: 2px solid #fed7aa; }

        .ear {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            top: -6px;
        }
        .panda .ear { background: #3f3f46; }
        .bear .ear { background: #fb923c; }
        .ear.left { left: -6px; }
        .ear.right { right: -6px; }

        .panda .eye {
            position: absolute;
            width: 22px;
            height: 26px;
            background: #3f3f46;
            border-radius: 50%;
            top: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .panda .eye.left { left: 18px; transform: rotate(-10deg); }
        .panda .eye.right { right: 18px; transform: rotate(10deg); }
        .panda .pupil {
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
        }

        .bear .eye {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #4b5563;
            border-radius: 50%;
            top: 36px;
        }
        .bear .eye.left { left: 24px; }
        .bear .eye.right { right: 24px; }

        .blush {
            position: absolute;
            width: 18px;
            height: 10px;
            background: #fecdd3;
            border-radius: 50%;
            top: 46px;
            opacity: 0.8;
        }
        .blush.left { left: 10px; }
        .blush.right { right: 10px; }

        .nose {
            position: absolute;
            width: 10px;
            height: 6px;
            background: #4b5563;
            border-radius: 50%;
            top: 46px;
            left: 45px;
        }
        
        /* Card Container Styles */
        .card-container {
            perspective: 1000px;
            width: 320px;
            height: 250px;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .card.is-open {
            transform: rotateY(180deg);
        }
        .card-front, .card-inside {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .card-front {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border: 3px dashed #fff;
            font-size: 5rem;
            color: #fff;
        }
        .card-inside {
            background: #fff;
            transform: rotateY(180deg);
            border: 3px solid #ff9a9e;
            text-align: center;
        }
        .card-message {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #ff4757;
        }
    </style>
</head>
<body>
    <div class="video-frame">
        <h1 class="title">Happy Birthday Wasay!</h1>
        
        <!-- Animated CSS Dudububu -->
        <div class="dudububu-css">
            <div class="panda">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="face">
                    <div class="eye left"><div class="pupil"></div></div>
                    <div class="eye right"><div class="pupil"></div></div>
                    <div class="blush left"></div>
                    <div class="blush right"></div>
                    <div class="nose"></div>
                </div>
            </div>
            <div class="bear">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="face">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="blush left"></div>
                    <div class="blush right"></div>
                    <div class="nose"></div>
                </div>
            </div>
        </div>
        
        <div class="card-container">
            <div class="card">
                <div class="card-front">
                    <span>💌</span>
                </div>
                <div class="card-inside">
                    <p class="card-message">
                        tysm for listening to my useless talk <strong style="color: #ff4757;">Dr. Wasay</strong> haha everyone's unpaid therapist.<br><br>
                        You are just perfect, ik u will achieve everything one day <em>pro plyr</em><br><br>
                        from your fangirl Zee K.
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        setTimeout(() => {
            document.querySelector('.card').classList.add('is-open');
        }, 3000);
    </script>
</body>
</html>
